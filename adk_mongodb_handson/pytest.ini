[pytest]
testpaths = tests
addopts = -ra
markers =
    replicaset: 単一ノード レプリカセットの MongoDB が必要 (docker compose --profile replicaset)
    standalone: 単一 mongod が必要 (docker compose --profile standalone)
    atlas_local: Atlas Local 8.2+ が必要 (docker compose --profile atlas-local)
    auth: 認証付き MongoDB が必要 (docker compose --profile auth)
    slow: 60 秒以上かかるテスト (TTL モニタ待ちなど)
    live: 外部 API (Gemini / Vertex AI) が必要。通常の CI では実行しない
filterwarnings =
    ignore:\[EXPERIMENTAL\]:UserWarning
